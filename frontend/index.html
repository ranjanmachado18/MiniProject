<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VulnBank - Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="navbar">
    <h1>&#128176; VulnBank</h1>
    <div><span class="badge">Intentionally Vulnerable - Educational Use Only</span></div>
  </div>

  <div class="container" style="max-width:420px;">
    <div class="card">
      <h2>Sign In</h2>
      <input id="login-username" placeholder="Username (try: admin)">
      <input id="login-password" type="password" placeholder="Password (try: admin123)">
      <button onclick="doLogin()">Login</button>
      <p id="login-error" class="error"></p>
      <p class="muted">Seed users: admin/admin123, alice/alice123, bob/bob123</p>
    </div>

    <div class="card">
      <h2>Register</h2>
      <input id="reg-username" placeholder="Username">
      <input id="reg-email" placeholder="Email">
      <input id="reg-password" type="password" placeholder="Password">
      <input id="reg-fullname" placeholder="Full name">
      <select id="reg-role">
        <option value="user">user</option>
        <option value="admin">admin (should NOT be allowed client-side!)</option>
      </select>
      <button onclick="doRegister()">Create account</button>
      <p id="reg-error" class="error"></p>
    </div>
  </div>

<script src="js/api.js"></script>
<script>
async function doLogin() {
  const username = document.getElementById('login-username').value;
  const password = document.getElementById('login-password').value;
  try {
    const data = await api('/auth/login', { method: 'POST', body: { username, password } });
    saveToken(data.token);
    saveUser(data.user);
    window.location.href = 'dashboard.html';
  } catch (e) {
    document.getElementById('login-error').textContent = e.message;
  }
}

async function doRegister() {
  const body = {
    username: document.getElementById('reg-username').value,
    email: document.getElementById('reg-email').value,
    password: document.getElementById('reg-password').value,
    full_name: document.getElementById('reg-fullname').value,
    role: document.getElementById('reg-role').value // intentionally client-controlled
  };
  try {
    await api('/auth/register', { method: 'POST', body });
    alert('Account created, please log in.');
  } catch (e) {
    document.getElementById('reg-error').textContent = e.message;
  }
}
</script>
</body>
</html>
